<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Даниил Иванов | Портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Все CSS-стили из оригинального примера */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background-color: #1a001a; color: #e0e0e0; line-height: 1.6; }
        /* ... (вставить все остальные стили из оригинального кода) ... */
        .heart { color: #ff1493; font-size: 24px; }
    </style>
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Создание структуры страницы
            const createElements = () => {
                // Header
                const header = document.createElement('header');
                const headerContainer = document.createElement('div');
                headerContainer.className = 'container';
                
                const h1 = document.createElement('h1');
                h1.className = 'neon-text';
                h1.textContent = 'Даниил Иванов';
                
                const dateElement = document.createElement('p');
                dateElement.innerHTML = '29 сентября 2005 <span class="heart">♥</span>';
                
                headerContainer.append(h1, dateElement);
                header.appendChild(headerContainer);
                
                // About Section
                const aboutSection = document.createElement('section');
                aboutSection.className = 'about';
                
                const aboutTitle = document.createElement('h2');
                aboutTitle.className = 'neon-text';
                aboutTitle.textContent = 'Немного о себе';
                
                const personalInfo = document.createElement('div');
                personalInfo.className = 'personal-info';
                personalInfo.innerHTML = `
                    <p>Ищу ту самую, с которой смогу разделить свои увлечения и мечты. <span class="highlight">Свободное сердце</span>, открытое для новых отношений и совместных приключений. Верю, что настоящие чувства рождаются из взаимного уважения и общих интересов.</p>
                    <p>Что могу предложить:</p>
                    <ul>
                        <li>Романтические прогулки под луной</li>
                        <li>Совместные путешествия</li>
                        <li>Поддержку в любых начинаниях</li>
                        <li>Искреннюю заботу</li>
                        <li>Нахождение общих тем для разговора</li>
                    </ul>
                    <p>Мечтаю найти девушку, которая ценит <span class="highlight">честность и открытость</span>. Готов вкладывать душу в отношения и создавать совместные воспоминания. Не люблю спонтанность, сюрпризы, но люблю стабильность.</p>
                `;
                
                aboutSection.append(aboutTitle, personalInfo);
                
                // Gallery
                const galleryContainer = document.createElement('div');
                galleryContainer.className = 'container';
                
                const galleryTitle = document.createElement('h2');
                galleryTitle.className = 'neon-text';
                galleryTitle.textContent = 'Мои фотографии';
                
                const gallery = document.createElement('div');
                gallery.className = 'gallery';
                
                // Добавление фотографий
                for (let i = 1; i <= 6; i++) {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.onclick = () => openModal(`photos/photo${i}.jpg`);
                    
                    const img = document.createElement('img');
                    img.src = `photos/photo${i}.jpg`;
                    img.alt = `Фото ${i}`;
                    
                    galleryItem.appendChild(img);
                    gallery.appendChild(galleryItem);
                }
                
                galleryContainer.append(galleryTitle, gallery);
                
                // Footer
                const footer = document.createElement('footer');
                footer.innerHTML = '<p>Готов к новым знакомствам! <span class="heart">♥</span></p>';
                
                // Модальное окно
                const modal = document.createElement('div');
                modal.id = 'myModal';
                modal.className = 'modal';
                
                const closeButton = document.createElement('span');
                closeButton.className = 'close';
                closeButton.innerHTML = '&times;';
                closeButton.onclick = closeModal;
                
                const modalImage = document.createElement('img');
                modalImage.className = 'modal-content';
                modalImage.id = 'modalImg';
                
                modal.append(closeButton, modalImage);
                
                // Сборка всей страницы
                document.body.append(
                    header,
                    aboutSection,
                    galleryContainer,
                    footer,
                    modal
                );
            };
            
            // Функции для модального окна
            window.openModal = (src) => {
                document.getElementById('modalImg').src = src;
                document.getElementById('myModal').style.display = 'flex';
            };
            
            window.closeModal = () => {
                document.getElementById('myModal').style.display = 'none';
            };
            
            // Обработчики событий
            window.onclick = (event) => {
                if (event.target === document.getElementById('myModal')) {
                    closeModal();
                }
            };
            
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') closeModal();
            });
            
            // Инициализация
            createElements();
        });
    </script>
</body>
</html>
