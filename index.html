<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniil Space | Cosmic Connection</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet>
    <style>
        /* Cosmic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: 0.3s ease;
        }

        /* Stellar Body */
        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a0015 radial-gradient(circle at center, #2a0044 0%, #0a0015 100%);
            color: #e0e0ff;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* Nebula Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Supernova Header */
        header {
            position: relative;
            padding: 80px 0;
            overflow: hidden;
            background: linear-gradient(45deg, #1a0032, #3d0069);
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
            margin-bottom: 60px;
        }

        header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.1;
            pointer-events: none;
        }

        h1, h2 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Pulsating Title */
        .neon-title {
            text-shadow: 0 0 15px rgba(135, 65, 255, 0.8),
                         0 0 30px rgba(135, 65, 255, 0.6),
                         0 0 45px rgba(135, 65, 255, 0.4);
            animation: pulse 2s infinite alternate;
        }

        /* Galactic Sections */
        .cosmic-card {
            background: rgba(15, 0, 30, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(135, 65, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Starlight List */
        .stellar-list {
            list-style: none;
            display: grid;
            gap: 15px;
            padding: 20px 0;
        }

        .stellar-list li {
            padding: 15px;
            background: rgba(135, 65, 255, 0.1);
            border-left: 4px solid #7f39fb;
            border-radius: 5px;
            position: relative;
        }

        .stellar-list li::before {
            content: '✦';
            margin-right: 10px;
            color: #7f39fb;
        }

        /* Meteor Gallery */
        .galaxy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 40px 0;
        }

        .cosmic-frame {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transform: scale(0.98);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cosmic-frame:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(135, 65, 255, 0.2);
        }

        .cosmic-frame img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
        }

        /* Black Hole Modal */
        .singularity {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .singularity.active {
            animation: singularity-open 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .event-horizon {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid #7f39fb;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(127, 57, 251, 0.4);
        }

        /* Shooting Star Footer */
        footer {
            text-align: center;
            padding: 60px 0 30px;
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 200%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #7f39fb, transparent);
            transform: translateX(-50%);
        }

        /* Animations */
        @keyframes pulse {
            from { opacity: 0.9; }
            to { opacity: 1; text-shadow: 0 0 25px rgba(135, 65, 255, 1),
                                         0 0 40px rgba(135, 65, 255, 0.8),
                                         0 0 55px rgba(135, 65, 255, 0.6); }
        }

        @keyframes singularity-open {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Mobile Supernova */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            header {
                padding: 60px 0;
                clip-path: polygon(0 0, 100% 0, 100% 95%, 0 100%);
            }

            .galaxy-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .cosmic-frame img {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Cosmic Initialization
            const createUniverse = () => {
                // Create Nebula Header
                const header = document.createElement('header');
                header.innerHTML = `
                    <div class="container">
                        <h1 class="neon-title">Daniil Space</h1>
                        <p>29.09.2005 <span style="color: #ff38e1">♡</span></p>
                    </div>
                `;

                // Create Personal Constellation
                const aboutSection = document.createElement('section');
                aboutSection.className = 'container cosmic-card';
                aboutSection.innerHTML = `
                    <h2>О космическом страннике</h2>
                    <p>Ищу спутницу для межгалактических путешествий. Готов разделить:</p>
                    <ul class="stellar-list">
                        <li>Прогулки по туманностям</li>
                        <li>Исследование чёрных дыр</li>
                        <li>Создание новых звёзд</li>
                        <li>Фотосессии у квазаров</li>
                        <li>Поиск тёмной материи</li>
                    </ul>
                    <p>Идеальная пара: честность × ответственность × любовь к науке</p>
                `;

                // Create Galaxy Gallery
                const gallerySection = document.createElement('div');
                gallerySection.className = 'container';
                gallerySection.innerHTML = '<h2>Галактический архив</h2>';
                
                const gallery = document.createElement('div');
                gallery.className = 'galaxy-grid';
                
                // Add Stellar Photos
                [1,2,3,4,5,6].forEach(num => {
                    const frame = document.createElement('div');
                    frame.className = 'cosmic-frame';
                    frame.onclick = () => openSingularity(`photos/photo${num}.jpg`);
                    
                    const img = document.createElement('img');
                    img.src = `photos/photo${num}.jpg`;
                    img.alt = `Stellar Capture #${num}`;
                    img.loading = 'lazy';
                    
                    frame.appendChild(img);
                    gallery.appendChild(frame);
                });

                gallerySection.appendChild(gallery);

                // Create Singularity (Modal)
                const singularity = document.createElement('div');
                singularity.className = 'singularity';
                singularity.onclick = (e) => e.target === singularity && closeSingularity();
                
                const eventHorizon = document.createElement('img');
                eventHorizon.className = 'event-horizon';
                
                const closeBtn = document.createElement('span');
                closeBtn.style = `
                    position: fixed;
                    top: 30px;
                    right: 30px;
                    color: white;
                    font-size: 40px;
                    cursor: pointer;
                    text-shadow: 0 0 15px #7f39fb;
                `;
                closeBtn.innerHTML = '×';
                closeBtn.onclick = closeSingularity;
                
                singularity.append(eventHorizon, closeBtn);

                // Create Supernova Footer
                const footer = document.createElement('footer');
                footer.innerHTML = `
                    <div class="container">
                        <p>Готов к запуску! <span style="color: #ff38e1">♡</span></p>
                    </div>
                `;

                // Assemble Universe
                document.body.append(
                    header,
                    aboutSection,
                    gallerySection,
                    singularity,
                    footer
                );
            };

            // Singularity Functions
            const openSingularity = (src) => {
                const modal = document.querySelector('.singularity');
                modal.querySelector('img').src = src;
                modal.classList.add('active');
                modal.style.display = 'flex';
            };

            const closeSingularity = () => {
                document.querySelector('.singularity').classList.remove('active');
                setTimeout(() => {
                    document.querySelector('.singularity').style.display = 'none';
                }, 300);
            };

            // Event Listeners
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeSingularity();
            });

            // Big Bang
            createUniverse();
        });
    </script>
</body>
</html>
