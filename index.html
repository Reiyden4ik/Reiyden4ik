<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Даниил Иванов | Портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(45deg, #1a001a, #2a002a);
            color: #e0e0e0;
            line-height: 1.7;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem 0;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ff149355;
        }

        .neon-text {
            font-family: 'Orbitron', sans-serif;
            color: #ff1493;
            text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493, 0 0 30px #ff1493;
            letter-spacing: 2px;
        }

        .heart {
            color: #ff1493;
            font-size: 1.5rem;
            animation: pulse 1.5s infinite;
        }

        .about {
            padding: 4rem 0;
            background: rgba(255, 255, 255, 0.05);
            margin: 2rem 0;
            clip-path: polygon(0 3%, 100% 0, 100% 97%, 0 100%);
        }

        .personal-info {
            background: rgba(0, 0, 0, 0.3);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid #ff149333;
            margin-top: 2rem;
            backdrop-filter: blur(5px);
        }

        .personal-info ul {
            padding-left: 2rem;
            margin: 1.5rem 0;
        }

        .personal-info li {
            margin-bottom: 0.8rem;
            position: relative;
        }

        .personal-info li::before {
            content: '♥';
            color: #ff1493;
            margin-right: 0.8rem;
        }

        .highlight {
            color: #ff1493;
            font-weight: 700;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            padding: 2rem 0;
        }

        .gallery-item {
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 20, 147, 0.2);
        }

        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
            border-top: 1px solid #ff149333;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.3);
        }

        .close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            color: white;
            font-size: 3rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #ff1493;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            header {
                padding: 1.5rem 0;
            }

            h1 {
                font-size: 1.8rem;
            }

            .about {
                clip-path: none;
                padding: 2rem 0;
            }

            .personal-info {
                padding: 1.5rem;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .gallery-item img {
                height: 250px;
            }

            .close {
                top: 1rem;
                right: 1rem;
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .neon-text {
                font-size: 1.2rem;
            }

            .personal-info {
                padding: 1rem;
            }

            .gallery-item img {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- Остальной HTML-код без изменений -->
    <script>
        // JavaScript-код без изменений
    </script>
</body>
</html>
