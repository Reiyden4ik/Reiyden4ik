<!DOCTYPE html>
<html>
<head>
    <title>Даниил Иванов</title>
    <script>
        document.documentElement.lang = 'ru';

const head = document.createElement('head');
const body = document.createElement('body');

// Создаем мета-теги
const meta1 = document.createElement('meta');
meta1.setAttribute('charset', 'UTF-8');
const meta2 = document.createElement('meta');
meta2.setAttribute('name', 'viewport');
meta2.setAttribute('content', 'width=device-width, initial-scale=1.0');
const title = document.createElement('title');
title.textContent = 'Даниил Иванов | Портфолио';

// Подключаем шрифты
const link = document.createElement('link');
link.setAttribute('href', 'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap');
link.setAttribute('rel', 'stylesheet');

// Создаем стили
const style = document.createElement('style');
style.textContent = `
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Roboto', sans-serif;
        background-color: #1a001a;
        color: #e0e0e0;
        line-height: 1.6;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    header {
        text-align: center;
        padding: 50px 0;
        background: linear-gradient(45deg, #2a0032, #4b0082);
        border-bottom: 3px solid #bf40bf;
    }

    h1, h2 {
        font-family: 'Orbitron', sans-serif;
        margin-bottom: 20px;
        text-shadow: 0 0 10px rgba(191, 64, 191, 0.5);
    }

    .about {
        padding: 40px 0;
        background: #2a0032;
        margin: 20px 0;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(191, 64, 191, 0.2);
    }

    .personal-info {
        padding: 30px;
        background: #3d004d;
        border-left: 5px solid #bf40bf;
        margin: 20px 0;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 15px;
        padding: 20px 0;
    }

    .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.3s;
        height: 300px;
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
    }

    .gallery-item:hover img {
        transform: scale(1.1);
    }

    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        max-width: 90%;
        max-height: 90%;
        object-fit: contain;
        border: 2px solid #bf40bf;
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(191, 64, 191, 0.5);
    }

    .close {
        position: absolute;
        top: 20px;
        right: 30px;
        color: #fff;
        font-size: 40px;
        cursor: pointer;
        text-shadow: 0 0 10px #bf40bf;
    }

    footer {
        text-align: center;
        padding: 30px;
        background: #2a0032;
        margin-top: 40px;
    }

    @media (max-width: 768px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr);
        }

        h1 {
            font-size: 24px;
        }

        .container {
            padding: 10px;
        }

        .gallery-item {
            height: 200px;
        }
    }

    @media (max-width: 480px) {
        .gallery {
            grid-template-columns: 1fr;
        }

        .personal-info {
            padding: 20px;
        }

        .modal-content {
            max-width: 95%;
        }

        .gallery-item {
            height: 250px;
        }
    }

    .neon-text {
        color: #bf40bf;
        text-shadow: 0 0 10px #bf40bf;
    }

    .highlight {
        color: #bf40bf;
        font-weight: bold;
    }

    .heart {
        color: #ff1493;
        font-size: 24px;
    }
`;

// Собираем head
head.append(meta1, meta2, title, link, style);
document.documentElement.append(head, body);

// Создаем шапку
const header = document.createElement('header');
const headerContainer = document.createElement('div');
headerContainer.className = 'container';

const h1 = document.createElement('h1');
h1.className = 'neon-text';
h1.textContent = 'Даниил Иванов';

const pHeader = document.createElement('p');
pHeader.innerHTML = '29 сентября 2005 <span class="heart">♥</span>';

headerContainer.append(h1, pHeader);
header.append(headerContainer);

// Создаем основное содержимое
const mainContainer = document.createElement('div');
mainContainer.className = 'container';

// Секция "О себе"
const aboutSection = document.createElement('section');
aboutSection.className = 'about';

const h2About = document.createElement('h2');
h2About.className = 'neon-text';
h2About.textContent = 'Немного о себе';

const personalInfo = document.createElement('div');
personalInfo.className = 'personal-info';
personalInfo.innerHTML = `
    <p>Ищу ту самую, с которой смогу разделить свои увлечения и мечты. <span class="highlight">Свободное сердце</span>, открытое для новых отношений и совместных приключений. Верю, что настоящие чувства рождаются из взаимного уважения и общих интересов.</p>
    <p>Что могу предложить:</p>
    <ul>
        <li>Романтические прогулки под луной</li>
        <li>Совместные путешествия</li>
        <li>Поддержку в любых начинаниях</li>
        <li>Искреннюю заботу</li>
        <li>Нахождение общих тем для разговора</li>
    </ul>
    <p>Мечтаю найти девушку, которая ценит <span class="highlight">честность и открытость</span>. Готов вкладывать душу в отношения и создавать совместные воспоминания. Не люблю спонтанность, сюрпризы, но люблю стабильность.</p>
`;

aboutSection.append(h2About, personalInfo);

// Галерея
const h2Gallery = document.createElement('h2');
h2Gallery.className = 'neon-text';
h2Gallery.textContent = 'Мои фотографии';

const gallery = document.createElement('div');
gallery.className = 'gallery';

// Функция для создания элементов галереи
const createGalleryItem = (num) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.onclick = () => openModal(`photos/photo${num}.jpg`);
    
    const img = document.createElement('img');
    img.src = `photos/photo${num}.jpg`;
    img.alt = `Фото ${num}`;
    
    item.append(img);
    return item;
};

for (let i = 1; i <= 6; i++) {
    gallery.append(createGalleryItem(i));
}

// Модальное окно
const modal = document.createElement('div');
modal.id = 'myModal';
modal.className = 'modal';

const closeSpan = document.createElement('span');
closeSpan.className = 'close';
closeSpan.innerHTML = '&times;';
closeSpan.onclick = closeModal;

const modalImg = document.createElement('img');
modalImg.className = 'modal-content';
modalImg.id = 'modalImg';

modal.append(closeSpan, modalImg);

// Футер
const footer = document.createElement('footer');
footer.innerHTML = '<p>Готов к новым знакомствам! <span class="heart">♥</span></p>';

// Собираем всю страницу
mainContainer.append(aboutSection, h2Gallery, gallery);
body.append(header, mainContainer, modal, footer);

// Функции для модального окна
function openModal(src) {
    modalImg.src = src;
    modal.style.display = 'flex';
}

function closeModal() {
    modal.style.display = 'none';
}

window.onclick = function(event) {
    if (event.target === modal) {
        closeModal();
    }
};

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeModal();
    }
});
    </script>
</head>
<body>
</body>
</html>
