<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Даниил Иванов | Портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* Исправленные и оптимизированные стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(45deg, #1a001a, #2a002a);
            color: #e0e0e0;
            line-height: 1.7;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid #ff149355;
        }

        .neon-text {
            font-family: 'Orbitron', sans-serif;
            color: #ff1493;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
            margin-bottom: 1rem;
        }

        /* Остальные стили из предыдущего ответа */
        /* ... */
    </style>
</head>
<body>
    <!-- Явная HTML-разметка вместо генерации через JavaScript -->
    <header>
        <div class="container">
            <h1 class="neon-text">Даниил Иванов</h1>
            <p>29 сентября 2005 <span class="heart">♥</span></p>
        </div>
    </header>

    <section class="about">
        <div class="container">
            <h2 class="neon-text">Немного о себе</h2>
            <div class="personal-info">
                <!-- Текстовая информация -->
            </div>
        </div>
    </section>

    <!-- Галерея -->
    <div class="container">
        <h2 class="neon-text">Мои фотографии</h2>
        <div class="gallery">
            <!-- Добавьте реальные пути к изображениям -->
            <div class="gallery-item">
                <img src="placeholder.jpg" alt="Фото 1">
            </div>
            <!-- ... остальные изображения ... -->
        </div>
    </div>

    <footer>
        <p>Готов к новым знакомствам! <span class="heart">♥</span></p>
    </footer>

    <script>
        // Упрощенный JavaScript для модального окна
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.createElement('div');
            modal.id = 'modal';
            modal.innerHTML = `
                <span class="close">&times;</span>
                <img class="modal-content" id="modalImage">
            `;

            document.body.appendChild(modal);

            document.querySelectorAll('.gallery-item img').forEach(img => {
                img.addEventListener('click', () => {
                    document.getElementById('modalImage').src = img.src;
                    modal.style.display = 'block';
                });
            });

            document.querySelector('.close').addEventListener('click', () => {
                modal.style.display = 'none';
            });
        });
    </script>
</body>
</html>
